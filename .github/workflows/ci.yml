name: CI

on:
  push:
    branches: [devel, main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # macOS — Apple Clang, Homebrew OpenSSL, full suite including coverage
  # ---------------------------------------------------------------------------
  macos:
    name: Build & Test (macOS)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSSL
        run: brew install openssl@3

      - name: Configure
        run: ./configure

      - name: Build
        run: make clean && make

      - name: ADR compliance check
        run: make adr-check

      - name: Baseline integrity (phase-0 frozen)
        run: make baseline-verify

      - name: Unit & E2E tests
        run: make test

      - name: Parity vs phase-0 baseline (ADR 0003)
        run: make parity

      - name: Coverage (gcov)
        run: make coverage

      - name: ASAN / UBSan
        run: make test-asan

      - name: Extension build (toy) — header isolation + unit tests
        run: make clean && make EXTENSIONS=toy && make EXTENSIONS=toy check-extension-headers test-unit

      - name: Extension build (redis) — Gate C header isolation + full suite
        run: make clean && make EXTENSIONS=redis && make EXTENSIONS=redis check-extension-headers test

      - name: Extension build (none) — HTTP-only binary + redis:// error
        run: make clean && make EXTENSIONS= && ./wrkx -t1 -c1 -d1s -R1 redis://localhost:9 2>&1 | grep -q 'no extension provides'

      - name: Install memcached (macOS)
        run: brew install memcached

      - name: Extension build (memcached) — real service E2E (macOS)
        run: |
          memcached -d -p 11211 -l 127.0.0.1
          sleep 0.3
          make clean && make EXTENSIONS=memcached
          bash tests/e2e/memcached_real.sh
          pkill memcached || true

  # ---------------------------------------------------------------------------
  # Linux — GCC, system OpenSSL, full suite
  # Note: `make coverage` is macOS-only for now — gcov file-naming differs
  # between Apple Clang and GCC in single-step compilation mode. A follow-up
  # task will add a cross-platform coverage approach (lcov or separate -c
  # compilation steps).
  # ---------------------------------------------------------------------------
  linux:
    name: Build & Test (Linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update -q && sudo apt-get install -y libssl-dev bc memcached

      - name: Configure
        run: ./configure

      - name: Build
        run: make clean && make

      - name: ADR compliance check
        run: make adr-check

      - name: Baseline integrity (phase-0 frozen)
        run: make baseline-verify

      - name: Unit & E2E tests
        run: make test

      - name: Parity vs phase-0 baseline (ADR 0003)
        run: make parity

      - name: ASAN / UBSan
        run: make test-asan

      - name: Extension build (toy) — header isolation + unit tests
        run: make clean && make EXTENSIONS=toy && make EXTENSIONS=toy check-extension-headers test-unit

      - name: Extension build (redis) — Gate C header isolation + full suite
        run: make clean && make EXTENSIONS=redis && make EXTENSIONS=redis check-extension-headers test

      - name: Extension build (none) — HTTP-only binary + redis:// error
        run: make clean && make EXTENSIONS= && ./wrkx -t1 -c1 -d1s -R1 redis://localhost:9 2>&1 | grep -q 'no extension provides'

      - name: Extension build (memcached) — real service E2E (Linux)
        run: |
          memcached -d -p 11211 -l 127.0.0.1
          sleep 0.3
          make clean && make EXTENSIONS=memcached
          bash tests/e2e/memcached_real.sh
          pkill memcached || true
